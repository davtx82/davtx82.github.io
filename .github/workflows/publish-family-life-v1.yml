name: Publish Family Life Discovery v1

on:
  push:
    branches: [main]
    paths:
      - 'family-life/v1/generator-part*.b64'
      - '.github/workflows/publish-family-life-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore generator
        run: |
          cat family-life/v1/generator-part0.b64 family-life/v1/generator-part1.b64 family-life/v1/generator-part2.b64 family-life/v1/generator-part3.b64 > /tmp/family-life-generator.b64
          base64 -d /tmp/family-life-generator.b64 | gzip -d > family-life/v1/generate.py
          python -m py_compile family-life/v1/generate.py

      - name: Generate static assessment
        run: |
          rm -rf family-life/v1/site
          python family-life/v1/generate.py
          test "$(find family-life/v1/site -maxdepth 1 -name '*.html' | wc -l)" -eq 28
          grep -q 'href="david.html"' family-life/v1/site/index.html
          grep -q 'href="ema.html"' family-life/v1/site/index.html
          grep -q 'href="trystan.html"' family-life/v1/site/index.html
          grep -q '9 sections · 55 questions' family-life/v1/site/david.html
          grep -q '6 sections · 31 questions' family-life/v1/site/trystan.html
          grep -q 'All questions in this section are required.' family-life/v1/site/david-now.html
          grep -q 'data-advance' family-life/v1/site/david-now.html
          grep -q 'Please answer all' family-life/v1/site/david-now.html
          grep -q 'Copy answer code' family-life/v1/site/david.html

      - name: Verify internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('family-life/v1/site')
          files={p.name for p in root.glob('*.html')}
          bad=[]
          for p in root.glob('*.html'):
              for h in re.findall(r'href="([^"]+\.html)"',p.read_text()):
                  if h not in files:
                      bad.append((p.name,h))
          if bad:
              raise SystemExit(str(bad))
          print('verified',len(files),'pages with no broken internal links')
          PY

      - name: Publish to gh-pages
        run: |
          cp -R family-life/v1/site /tmp/family-life-v1
          git reset --hard HEAD
          git clean -fd family-life/v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf family-life/v1
          mkdir -p family-life/v1
          cp -R /tmp/family-life-v1/. family-life/v1/
          touch family-life/v1/.nojekyll
          git add family-life/v1
          git commit -m "Publish Family Life Discovery v1" || true
          git push origin gh-pages
