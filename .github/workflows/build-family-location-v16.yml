name: Build Family Location v16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-family-location-v16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build one-file questionnaire
        shell: python
        run: |
          import urllib.request
          from pathlib import Path

          base = 'https://family-location-discovery.vercel.app/'
          names = ['adult0.js','adult1.js','adult2.js','adult3.js','teen.js','app.js']
          with urllib.request.urlopen(base, timeout=30) as r:
              html = r.read().decode('utf-8')
          for name in names:
              with urllib.request.urlopen(base + name, timeout=30) as r:
                  js = r.read().decode('utf-8')
              html = html.replace(f'<script src="{name}"></script>', '<script>\n' + js + '\n</script>')
          html = html.replace('Family Location Discovery</div><h1>', 'Family Location Discovery · Build 16</div><h1>', 1)
          html = html.replace('data-person="David"', 'data-person="David" onclick="window.selectPerson&&window.selectPerson(\'David\')"', 1)
          html = html.replace('data-person="Ema"', 'data-person="Ema" onclick="window.selectPerson&&window.selectPerson(\'Ema\')"', 1)
          html = html.replace('data-person="Trystan"', 'data-person="Trystan" onclick="window.selectPerson&&window.selectPerson(\'Trystan\')"', 1)
          html = html.replace('function load(p){', 'window.selectPerson=function(p){', 1)
          html = html.replace('updateBadges();showDashboard()}\nfunction minNeeded', 'updateBadges();showDashboard()};\nfunction minNeeded', 1)
          html = html.replace("b.addEventListener('click',()=>load(b.dataset.person))", "b.addEventListener('click',()=>window.selectPerson(b.dataset.person))")
          out = Path('family-location/v16/index.html')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(html, encoding='utf-8')
          print('built', out, len(html), 'bytes')
      - name: Commit built page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-location/v16/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Build family location questionnaire v16"
          git push
